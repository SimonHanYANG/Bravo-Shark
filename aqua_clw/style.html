.nav .nvpin i{width:auto;height:auto;flex:0 0 auto;padding:0;background:transparent;
  border-radius:0;font-size:inherit;line-height:0}
/* 桌面端：鼠标进侧栏才淡淡露出九颗钉子（告诉你有这回事），指到哪一项哪一颗变实。
   顺序不能调 —— .nav:hover .nvpin 与 .nvi:hover .nvpin 权重相同，靠后写的赢。 */
.nav:hover .nvpin{opacity:.3}
.nvi:hover .nvpin,.nvi:focus-within .nvpin{opacity:1}
.nav .nvpin:focus-visible{opacity:1;outline:2px solid var(--gold2);outline-offset:2px}
.nav .nvpin:hover{background:var(--bg3);color:var(--gold2);transform:none}
.nvi.pin-on .nvpin{opacity:1;color:var(--coral)}
.nvi.pin-on .nvpin:hover{background:rgba(240,96,60,.12)}
@media (hover:none){
  .nav .nvpin{opacity:.4;width:30px;height:30px}
  .nvi.pin-on .nvpin{opacity:1}
}
/* 置顶组：和下面三组之间用一条虚线断开，读起来像「这里是快捷方式，不是分类」 */
.navgrp-pin{padding-bottom:13px;margin-bottom:15px;border-bottom:1px dashed var(--line)}
.navgrp-pin .navgrp-t{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:0;color:var(--dim2)}
.navgrp-pin .navgrp-line{flex:1;height:1px;background:var(--line)}
.navgrp-pin .navgrp-h::after{display:none}
#navPinList{display:flex;flex-direction:column;gap:6px}

/* =====================================================================
   鲨鱼互动：两条鱼面对面（结构在 duel.js）
   —— 「谁坐对面」原来只有一行小字。这里把它变成看得见的两条鱼：
      左边对面那位（名字与身份挂在下面），右边你的主形象。点谁谁开口。
   ===================================================================== */
.duel{margin:14px 0 16px;padding:15px 16px 16px;border:1px solid var(--line);
  border-radius:var(--r2);background:linear-gradient(180deg,#FFFDFB 0%,#FBF7F3 100%)}
.duel-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.duel-h b{font-size:15.5px;font-weight:800;color:var(--txt)}
.dueln{font-size:11.5px;font-weight:700;color:var(--dim2);margin-left:auto}
.duel-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.duelfig{width:150px;text-align:center;border-radius:14px;padding:8px 6px 9px;
  border:1px solid transparent;background:transparent;transition:.16s;cursor:pointer}
.duelfig:hover{background:var(--bg3);border-color:var(--hair);transform:translateY(-2px)}
.duelfig.duelme:hover{background:rgba(47,127,191,.07)}
.duelfig .dv{line-height:0;display:flex;justify-content:center}
.duelfig .dn{font-size:15px;font-weight:800;color:var(--txt);margin-top:6px}
.duelfig .dr{font-size:11.5px;line-height:1.55;color:var(--dim2);margin-top:2px}
.duelvs{flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--dim2);
  line-height:1;border:1px dashed var(--line);border-radius:999px;padding:6px 10px;background:#fff}
.duel-bub{margin-top:12px;padding:11px 13px;border-radius:11px;background:var(--bg3);
  border-left:3px solid var(--coral2);font-size:13.5px;line-height:1.72;color:var(--txt)}
.duel-bub b{font-weight:800}
.bubrow{margin-top:7px;font-size:13px;line-height:1.7;color:var(--dim)}
.bubrow i{display:inline-block;font-style:normal;font-weight:800;font-size:11.5px;
  padding:1px 7px;border-radius:6px;margin-right:6px;background:rgba(60,45,35,.08);color:var(--dim)}
.bubrow.no i{background:rgba(240,96,60,.14);color:var(--coral5)}
.bubrow.yes i{background:rgba(11,96,73,.14);color:#0B6049}
.bubsay{margin-top:6px;padding:9px 11px;border-radius:9px;background:#FFFDF6;
  border:1px dashed rgba(200,150,60,.5);font-size:14px;line-height:1.7;font-weight:600}
.duelacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.duel-foot{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.duel-tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:11px}
.duel-tabs button{font-size:12.5px;padding:4px 13px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--dim);font-weight:700}
.duel-tabs button.on{background:var(--grad-pri);border-color:transparent;color:#FBFDFF}
/* 群面：一桌六条鱼（五个角色 + 你） */
.grp-row{display:flex;align-items:flex-start;justify-content:center;gap:4px;flex-wrap:wrap}
.grp-row .duelfig{width:104px}
.grp-row .duelfig .dn{font-size:12.5px;margin-top:4px}
.grp-row .duelfig .dr{font-size:11.5px}

/* 进阶话术包：分享解锁的追加内容（原有功能一个都不锁） */
.advpack{margin-top:12px;border:1px solid var(--line);border-radius:var(--r2);
  background:#fff;padding:13px 14px}
.advpack.open{border-color:rgba(11,96,73,.28);background:linear-gradient(180deg,#FFFDFB,#F7FBF9)}
.adv-h{display:flex;align-items:baseline;gap:9px}
.adv-h b{font-size:15px;font-weight:800;color:var(--txt)}
.advtag{font-size:11.5px;font-weight:800;color:#8A5E14;background:rgba(200,150,60,.16);
  padding:2px 9px;border-radius:7px}
.advtag.on{color:#0B6049;background:rgba(11,96,73,.14)}
.adv-lock{margin-top:9px;font-size:13px;line-height:1.7;color:var(--dim)}
.advbar{height:7px;border-radius:999px;background:rgba(60,45,35,.10);overflow:hidden;margin:9px 0 5px}
.advbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F0603C,#E8B94A)}
.advp{font-size:11.5px;color:var(--dim2)}
.advcard{margin-top:11px;padding:11px 12px;border:1px solid var(--hair);border-radius:11px;background:#FFFDFB}
.advq{font-size:14.5px;font-weight:800;color:var(--txt);line-height:1.6}
.advm{font-size:12.5px;color:var(--dim2);margin-top:3px}
.advno,.advyes{margin-top:7px;font-size:13px;line-height:1.7}
.advno i,.advyes i{display:inline-block;font-style:normal;font-weight:800;font-size:11.5px;
  padding:1px 7px;border-radius:6px;margin-right:6px}
.advno i{background:rgba(240,96,60,.14);color:var(--coral5)}
.advyes i{background:rgba(11,96,73,.14);color:#0B6049}

/* 分享进度（我的鱼塘） */
.shareprog{margin-top:16px}
.sp-row{font-size:14px;color:var(--dim);margin:8px 0 4px}
.sp-row b{font-size:20px;font-weight:800;color:var(--gold);margin-right:2px}
.sp-dots{display:flex;gap:8px;margin:8px 0 10px}
.spdot{width:26px;height:26px;border-radius:50%;border:1px dashed var(--line);
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;
  font-weight:800;color:var(--dim2);background:#fff}
.spdot.on{border-style:solid;border-color:transparent;background:linear-gradient(135deg,#F0603C,#E8B94A);color:#fff}
.spdot i{font-style:normal}
.sp-list{display:flex;flex-direction:column;gap:6px}
.spi{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;
  padding:7px 10px;border-radius:9px;background:var(--bg3);color:var(--dim)}
.spi.on{background:rgba(11,96,73,.09);color:#0B6049}
.spn{font-weight:800;flex:0 0 auto}
.spw{flex:1;min-width:120px}
.sps{font-weight:800;flex:0 0 auto}
.sp-note{margin-top:10px;font-size:11.5px;line-height:1.65;color:var(--dim2)}
/* 商店里的分享限定件 */
.skin.shareonly{border-color:rgba(240,96,60,.3);background:linear-gradient(180deg,#FFFDFB,#FDF3EE)}
.sharebz{position:absolute;top:8px;right:8px;font-size:11.5px;font-weight:800;
  color:var(--coral5);background:rgba(240,96,60,.14);padding:1px 8px;border-radius:7px}

/* =====================================================================
   双通道版（2026-09-26）：开屏两个通道 · 通道头 · 跟着光标游的鱼 · 成长卡
   ===================================================================== */
/* 开屏两个通道：左右并列，点哪个进哪条动线 */
.tracks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:22px 0 6px}
.track{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  pointer-events:auto;   /* ★ .splash-c 整块是 pointer-events:none，不显式打开按钮就点不到 */
  min-width:230px;padding:15px 19px 16px;border-radius:18px;cursor:pointer;
  border:1px solid rgba(255,255,255,.30);background:rgba(255,255,255,.13);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  color:#F4FBFF;transition:.18s;box-shadow:0 8px 26px rgba(6,30,48,.20)}
.track:hover{transform:translateY(-3px);background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
.track b{font-size:21px;font-weight:800;letter-spacing:.01em}
.track span{font-size:13.5px;font-weight:700;color:#CFE9F8}
.track em{font-style:normal;font-size:12.5px;color:#AFD3E8;margin-top:3px}

/* 通道头：侧栏最上面一行，写清「现在这条线是什么、怎么切」 */
.navtrack{display:flex;align-items:center;gap:8px;padding:0 10px 10px;margin-bottom:4px;
  border-bottom:1px dashed var(--line)}
.navtrack b{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--gold);
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navtrack button{font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:700;
  border:1px solid var(--line);background:var(--bg3);color:var(--dim)}
.navtrack button:hover{background:#EDE5DA;color:var(--txt)}
.navlist{display:flex;flex-direction:column;gap:6px}
.nvi[hidden]{display:none}

/* 跟着光标游的鱼：一层，四条影子。在内容之下（z-index:0），不挡点击。 */
.herofish{position:fixed;left:0;top:0;right:0;bottom:0;z-index:0;pointer-events:none;
  opacity:.42}   /* ★ 不再依赖 body.entered：那个类没人加，鱼层会永远透明（实测踩过） */
/* ★ .hf 不能只在 .herofish 里生效：开屏（#splashFish）用的是同一段标记，
   少了定位它们就按普通流竖着排成一条（实测第一版就是这样，像一串糖葫芦）。 */
.hf{position:absolute;left:0;top:0;will-change:transform}
#splashFish{position:absolute;inset:0;z-index:2;pointer-events:none}
#splashFish .hf{left:auto;top:auto}
.sfloor{pointer-events:none}   /* 地板是装饰，不许吃掉开屏按钮的点击 */
.herofish .hf svg{overflow:visible}
@media (prefers-reduced-motion: reduce){ .herofish{transition:none} }

/* 我的鱼塘：成长卡 */
.growcard{background:linear-gradient(180deg,#FBFDFF 0%,#F4FAFE 46%,#EAF5FC 100%);
  border-color:rgba(47,127,191,.22)}
.growrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.growfish{flex:0 0 auto;line-height:0}
.growinfo{flex:1;min-width:200px}
.grownow{font-size:19px;font-weight:800;color:var(--txt)}
.king{font-size:12.5px;font-weight:800;color:#8A5A12;background:rgba(232,185,74,.22);
  padding:2px 9px;border-radius:8px;margin-left:6px;vertical-align:2px}
.growd{font-size:13.5px;color:var(--dim);margin-top:4px}
.growbar{height:9px;border-radius:999px;background:rgba(47,127,191,.14);overflow:hidden;margin:11px 0 6px}
.growbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#F0632C,#E8B94A,#2F7FBF);transition:width .5s ease}
.grownxt{font-size:12.5px;color:var(--dim2)}
.growline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:13px;
  font-size:12.5px;color:var(--dim2)}
.growline i{font-style:normal;color:var(--line)}
.gst{padding:2px 9px;border-radius:999px;background:var(--bg3);font-weight:700}
.gst.on{background:rgba(47,127,191,.16);color:#1F5680}
.grownote{margin-top:10px;font-size:11.5px;line-height:1.65;color:var(--dim2)}
/* 返回条：内容区最上面一行，只在「不是我的鱼塘」时出现。
   非粘性：二级页面的入口都在页面顶部，进来第一眼就能看到，不需要一直挂在屏幕上。 */
.backbar{margin:-6px 0 12px;display:flex}
.backbar button{font-size:13px;font-weight:700;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--dim);
  cursor:pointer;transition:.16s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.backbar button:hover{background:#fff;color:var(--txt);border-color:var(--gold3)}
.backbar button[hidden]{display:none}

/* 对阵框收起开打后的占位（.duel 自己有 display，hidden 必须显式压过它） */
.duel[hidden]{display:none}

/* 今日公开动态：给的是入口，不是内容流 —— 做成 2 列卡片，一眼扫完 */
.rvtoday{border-color:rgba(217,96,58,.30)}
.rvtgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:10px;margin-top:4px}
.rvtitem{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.72);text-decoration:none;transition:.16s}
.rvtitem:hover{background:#fff;border-color:var(--gold3);transform:translateY(-1px)}
.rvtitem b{font-size:14.5px;color:var(--txt)}
.rvtitem span{font-size:12.5px;color:var(--dim);line-height:1.5}
.rvtitem i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--gold);margin-top:2px}


/* =====================================================================
   沧澜湾风格皮肤（2026-09-27）
   ---------------------------------------------------------------------
   目标：让职场鱼塘的界面与「沧澜湾人才库_蓝纹版」**极度相似**。
   来源设计语言（逐条对应）：
     · 白底 + 极浅蓝打底（radial 两处），分层靠纹理与投影，不靠底色
     · 整页两组同心水纹（左上 / 右下，固定）+ 两组斜向蓝纹（115°/65°）
     · 浮雕两色：上缘近白高光 + 下缘极淡暗影（--emb-hi / --emb-lo）
     · 栏目标题：左侧蓝色竖条 + 下方水纹短线
     · 卡片：白面 + 1px 蓝线 + 右上角涟漪
     · 主按钮：深蓝渐变 + 明显压印
     · 侧栏：白→极浅蓝渐变 + 右侧投影 + 底部一大圈浮雕水纹
     · 开屏：白底 + 一整圈同心浮雕水纹 + 居中白卡

   ★ 做法：**追加**在样式表最末（样式表闭合标签之前），原文件字节一个没动。
     好处：构建里可以断言「新样式表＝原样式表（除末尾闭合标签外逐字节保留）＋追加层」，
     想回退只删这一段。
   ★ 变量名一个没改（--bg / --gold / --txt / --hair / --shin …），
     所以逻辑层与 JS 生成的 HTML 自动跟着换色 —— 功能一行不用碰。
   ===================================================================== */

:root{
  /* ---- 白底：纯白作面、极浅蓝作底 ---- */
  --bg:#FFFFFF; --bg2:#FFFFFF; --bg3:#EDF4FA; --bg4:#F8FBFE;
  --line:#D9E7F3; --line2:#C4D9EA; --hair:#D9E7F3;
  /* ---- 墨三级（冷墨，按白底重算过对比度）---- */
  --txt:#16324B; --dim:#3D5F7C; --dim2:#506E8A;
  /* ---- 主色：海蓝（原来那一档是深海军蓝，这里提亮一档）---- */
  --gold:#1E6EA8; --gold2:#2E7FBE; --gold3:#9CC0DD;
  /* ---- 语义色 ---- */
  --cyan:#1E6EA8; --red:#C9502B; --green:#3E7A5E; --violet:#7A4460;
  --peach:#A8721F; --sand:#DBE7F2; --mid:#3E7A5E;
  --acc:var(--gold); --ok:var(--green); --bad:var(--red); --vio:var(--violet);
  --r:20px; --r2:14px;
  /* ---- 浮雕与水纹 ---- */
  --emb-hi:rgba(255,255,255,.96); --emb-lo:rgba(14,42,68,.10);
  --wave:rgba(30,110,168,.07);
  --sh:0 8px 22px rgba(14,42,68,.055);
  --sh2:0 16px 42px rgba(14,42,68,.12);
  --shin:inset 0 1px 0 rgba(255,255,255,.96), inset 0 -1px 0 rgba(14,42,68,.045);
}

/* ---------------- 底：白面 + 斜向蓝纹 ---------------- */
html{
  background:
    radial-gradient(circle at 10% 6%, #F1F8FD 0%, rgba(241,248,253,0) 52%),
    radial-gradient(circle at 92% 94%, #EDF5FC 0%, rgba(237,245,252,0) 58%),
    #FFFFFF;
}
body{
  background-color:transparent;
  background-image:
    repeating-linear-gradient(115deg, var(--wave) 0 1px, rgba(0,0,0,0) 1px 13px),
    repeating-linear-gradient(65deg, rgba(30,110,168,.042) 0 1px, rgba(0,0,0,0) 1px 19px);
  background-attachment:fixed;
}
/* 整页两组同心浮雕水纹：右下 + 左上，固定不动，压得很淡 */
body::after{
  content:""; position:fixed; right:-140px; bottom:-180px; width:760px; height:760px;
  border-radius:50%; pointer-events:none; z-index:0;
  background:repeating-radial-gradient(circle at 50% 50%,
    rgba(30,110,168,.072) 0 1px, rgba(0,0,0,0) 1px 26px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
}
body::before{
  content:""; position:fixed; left:-180px; top:-200px; width:620px; height:620px;
  border-radius:50%; pointer-events:none; z-index:0;
  background:repeating-radial-gradient(circle at 50% 50%,
    rgba(30,110,168,.06) 0 1px, rgba(0,0,0,0) 1px 30px);
}
/* 旧的整屏 SVG 纹理换成上面两组 CSS 水纹（同一套视觉语言，不再是另一种纹样） */
.ripple{display:none}
/* 游动的鱼压到很低：沧澜湾那一版没有这一层，留着一点生气但不抢视觉 */
.herofish{opacity:.07}
.shell,.main,.side{position:relative; z-index:1}

/* ---------------- 侧栏：白→极浅蓝 + 右侧投影 + 底部浮雕水纹 ---------------- */
.side{
  background:linear-gradient(180deg,#FFFFFF 0%,#F7FBFF 100%);
  border-right:1px solid var(--line);
  box-shadow:1px 0 0 var(--emb-hi), 14px 0 34px rgba(14,42,68,.045);
  overflow:hidden;
}
.side::after{
  content:""; position:absolute; left:-120px; bottom:-140px; width:440px; height:440px;
  border-radius:50%; pointer-events:none;
  background:repeating-radial-gradient(circle at 50% 50%,
    rgba(30,110,168,.07) 0 1px, rgba(0,0,0,0) 1px 22px);
}
.side > *{position:relative; z-index:1}
.side .brand{color:var(--gold); border-bottom-color:var(--line)}
.side .brand i{background:var(--gold); box-shadow:0 0 0 3px rgba(30,110,168,.16)}

/* 导航项：压印的胶囊；选中态用内凹（和卡片的凸起形成对比） */
.nav button{border-radius:12px; box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.nav button:hover{background:linear-gradient(180deg,#FFFFFF,#F1F8FD)}
.nav button.on{
  background:linear-gradient(180deg,#EAF4FC,#DCEBF8);
  border-color:var(--line2); color:var(--gold); font-weight:700;
  box-shadow:inset 0 2px 5px rgba(14,42,68,.10), inset 0 -1px 0 var(--emb-hi);
}

/* ---------------- 内容区：不再是深色玻璃板，改成白面直排 ---------------- */
.main{padding:30px 34px 100px}
.main-in{
  max-width:940px; margin:0 auto;
  background:transparent; border:none; box-shadow:none; padding:0;
}

/* ---------------- 栏目标题：左侧蓝条 + 下方水纹短线 ---------------- */
.vhead{margin-bottom:22px; position:relative}
.vhead h1{
  color:var(--txt); position:relative; padding-left:16px;
  font-size:30px; letter-spacing:-.02em;
}
.vhead h1::before{
  content:""; position:absolute; left:0; top:.22em; width:6px; height:1.06em; border-radius:3px;
  background:linear-gradient(180deg,#4D9BD1,var(--gold2));
  box-shadow:0 1px 0 var(--emb-hi), 0 3px 8px rgba(30,110,168,.28);
}
.vhead::after{
  content:""; display:block; margin:11px 0 0; height:8px; border-radius:5px;
  background:
    repeating-linear-gradient(90deg, rgba(30,110,168,.32) 0 16px, rgba(0,0,0,0) 16px 28px),
    linear-gradient(180deg, rgba(30,110,168,.10), rgba(0,0,0,0) 72%);
}
.eyebrow{color:var(--gold2); letter-spacing:.2em}
.sub{color:var(--dim)}
.note{color:var(--dim2)}

/* ---------------- 卡片：压印白面 + 右上角涟漪 ---------------- */
.card{
  background-image:
    radial-gradient(circle at 102% -6%, rgba(30,110,168,.07), rgba(0,0,0,0) 40%),
    repeating-radial-gradient(circle at 104% -10%,
      rgba(30,110,168,.05) 0 1px, rgba(0,0,0,0) 1px 15px);
  border:1px solid var(--line);
  box-shadow:0 8px 22px rgba(14,42,68,.055), inset 0 1px 0 var(--emb-hi), inset 0 -1px 0 rgba(14,42,68,.035);
}
.card.hi{border-color:var(--line2)}
.card h3, .card h4{position:relative; padding-left:13px}
.card h3::before, .card h4::before{
  content:""; position:absolute; left:0; top:.52em; width:8px; height:2px; border-radius:2px;
  background:var(--gold); box-shadow:0 3px 0 rgba(30,110,168,.26);
}

/* ---------------- 按钮：主按钮压出来，次按钮浅浮雕 ---------------- */
button.pri{
  background:linear-gradient(180deg,#2E7FBE,var(--gold));
  border-color:#124C77; color:#F7FBFF;
  box-shadow:0 5px 14px rgba(30,110,168,.26), inset 0 1px 0 rgba(255,255,255,.34), inset 0 -1px 0 rgba(0,0,0,.16);
}
button.pri:hover{background:linear-gradient(180deg,#2871AC,#124C77); border-color:#124C77}
.acts button:not(.pri):not(.cta), .id-acts button:not(.pri):not(.cta), .side button:not(.nav button){
  background:linear-gradient(180deg,#FFFFFF,#F2F8FC);
  border-color:var(--line2);
  box-shadow:0 2px 8px rgba(14,42,68,.07), inset 0 1px 0 var(--emb-hi), inset 0 -1px 0 rgba(14,42,68,.05);
}
button:active{box-shadow:inset 0 2px 6px rgba(14,42,68,.16)}

/* ---------------- 表单：内凹（与卡片的凸起形成对比） ---------------- */
input[type=text], input[type=password], textarea, select{
  background:#FBFDFF; border-color:var(--line2); color:var(--txt);
  box-shadow:inset 0 2px 4px rgba(14,42,68,.06), inset 0 -1px 0 var(--emb-hi);
}
input:focus, textarea:focus, select:focus{outline:2px solid rgba(30,110,168,.35); outline-offset:1px}
::placeholder{color:var(--dim2); opacity:.85}

/* ---------------- 标签与说明块 ---------------- */
.tagx{border-color:var(--line2); background:#F7FAFD; color:var(--gold)}
.hl{color:var(--gold)}
.empty{color:var(--dim2)}
.discbox, .legallinks{border-color:var(--line); background:var(--bg3)}

/* ---------------- 弹窗 ---------------- */
.mask{background:rgba(14,42,68,.42)}
.modal{background:var(--bg2); border:1px solid var(--line); border-radius:22px; box-shadow:var(--sh2)}
.mh{border-bottom-color:var(--line)}
.mf{border-top-color:var(--line); background:var(--bg3)}
.mh button{color:var(--dim2)}

/* =====================================================================
   开屏 · 从「白底 + 水纹」升级成「一片浅海」（2026-09-27）
   ---------------------------------------------------------------------
   上一版把整套水下光照收掉了。那个判断是对的（那几条光柱是给深底画的：
   白底上 50% 不透明度会变成一块灰），但收完之后只剩「白底 + 同心水纹 +
   白卡」，等于一张纸：没有纵深、没有焦点、没有品牌。用户反馈「太寡淡」。

   这一版的原则是「加纵深，不加装饰」——四条：
     ① 用光做纵深，不用色块做装饰。天空 → 水面 → 水底三段浅蓝渐变，
        全程低饱和，但有明确的上下之分。
     ② 收掉的东西「按浅底重画」，不是原样恢复：
        · 光柱：白色 → 浅蓝，且 blend 从 screen 改回 normal（screen 在白底上等于隐形）
        · 气泡：纯白 → 带描边的淡蓝小球（白点落在白底上本来就是看不见的）
        · 白卡：26px/64px 的大黑阴影 → 蓝投影。截图里那团"脏灰"就是旧阴影。
     ③ 品牌层补回来。开屏原来一个字都没有；现在有字号层级：
        品牌字 → 主标题（27→31px）→ 副标题 → 两个入口。
     ④ 两个入口做成「选项」而不是「清单项」：左侧强调条 + 箭头 + hover 位移。
        它们不是列表，是要人做决定的两个方向。

   ★ 仍然收着的两样，理由写在这里免得下一个人又去"恢复"：
     · .swater（焦散 / 浪线）：它是给深底打光的水面效果，浅底上没有可加的光。
     · .sfloor（海床方块）：SVG 里是硬编码的暖色珊瑚，在冷调浅底上收不住颜色，
       而 CSS 改不了内联 SVG 的 fill。底部纵深交给上面的水底渐变。
     · #splashSnow：白点在白底上没有意义。
   ★ 开屏那条鱼恢复了。它跟着光标游，是这屏唯一的活物，也是品牌本身。
     之前糊成灰是「半透明白」的问题，不是鱼的问题 —— 实心 + 蓝投影即可。
   ===================================================================== */
.splash{
  background:
    radial-gradient(74% 40% at 50% -6%, rgba(255,255,255,.98) 0%, rgba(255,255,255,0) 72%),
    radial-gradient(118% 44% at 50% 108%, #C6E0F2 0%, rgba(198,224,242,0) 68%),
    linear-gradient(180deg,#FBFDFF 0%,#EDF5FC 30%,#DCEBF8 58%,#CCE1F3 100%);
}
.splash::before{
  content:""; position:absolute; left:50%; bottom:-44%; transform:translateX(-50%);
  width:1440px; height:1440px; border-radius:50%; pointer-events:none;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(30,110,168,.17) 0 1.6px, rgba(0,0,0,0) 1.6px 38px),
    repeating-radial-gradient(circle at 50% 50%, rgba(30,110,168,.10) 0 1.2px, rgba(0,0,0,0) 1.2px 152px);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0 40%, rgba(0,0,0,0) 72%);
  mask-image:radial-gradient(circle at 50% 50%, #000 0 40%, rgba(0,0,0,0) 72%);
}
.splash::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(30,110,168,.05) 0 1px, rgba(0,0,0,0) 1px 46px);
}
.swater, .sfloor{display:none}
.srays{display:block}
.srays i{
  background:linear-gradient(180deg,
    rgba(255,255,255,.88) 0%, rgba(176,220,246,.46) 30%,
    rgba(146,200,236,.18) 62%, rgba(146,200,236,0) 92%);
  mix-blend-mode:normal; opacity:.62; filter:blur(15px);
}
/* ★ #splashBub 必须自己带 z-index：单个 .bub 上写着 z-index:9990，
   而 #splashBub 是 z-index:auto —— 于是气泡直接在 .splash 这个层叠上下文里
   按 9990 排，压过卡片（z-index:3）。水面上的气泡盖在白卡与文字上很难看
   （窄屏特别明显：一颗泡正好落在第二张入口卡上）。
   给它一个 1 就变成独立上下文：气泡之间还是 9990 的关系，但整组落在卡片下面。 */
#splashBub{z-index:1}
.splash .bub{
  background:radial-gradient(circle at 34% 30%, #FFFFFF 0%, #D7ECFA 46%, #AFD3EC 100%);
  box-shadow:inset 0 0 0 1px rgba(30,110,168,.20), 0 1px 3px rgba(14,42,68,.10);
}
/* ★ 开屏的鱼最终仍然收着，试过再放开，结论是「不合适」：
   它跟着光标游，而这一屏的卡片占了正中，鱼必然有大半时间压在卡片底下，
   露一条被切掉半截的橙色鱼，看着像渲染错误而不是设计。
   （深色版之所以好看，是因为那版卡片是透明玻璃，鱼从后面游过去是"隔水看鱼"。）
   想要"不寡淡"应该靠纵深与层级，不靠往画面里塞东西：
   天空→水面→水底三段渐变 + 光柱 + 气泡 + 双圈水纹 + 品牌字 + 卡片层级 —— 这些已经在上面了。
   #splashFish 留 display:block 会在窄屏把卡片边缘顶出一条橙色，所以明确收掉。 */
#splashFish{display:none}
#splashSnow{display:none}

/* ---------------- 白卡：去掉灰晕，换蓝投影 + 补品牌字 ---------------- */
.splash-c{
  max-width:680px; padding:38px 32px 26px; border-radius:26px;
  /* ★ 必须不透明：半透时光栅与水纹会从卡片里透出来，看着像脏了（实测 .95 还看得出来） */
  background:linear-gradient(180deg,#FFFFFF 0%,#FCFEFF 62%,#F7FBFE 100%);
  border:1px solid #D3E4F3;
  box-shadow:0 20px 46px rgba(24,74,116,.14), 0 2px 6px rgba(24,74,116,.06),
    inset 0 1px 0 #FFFFFF, inset 0 -1px 0 rgba(14,42,68,.05);
  position:relative; z-index:3;
}
/* 品牌字用伪元素补：body.html 在皮肤树里必须与原版逐字节一致，不能加标签。
   它是装饰性的重复信息（侧栏已有同名品牌），所以不进读屏序列也没关系。 */
/* ★ 这一条上一版漏了，是「看着发灰」的真凶：深色版把 .splash-c:before 改成了
   rgba(4,26,42,.60) 的深色玻璃晕，而伪元素带 z-index:-1 —— 按 CSS 绘制顺序，
   负层级子元素画在「自身背景之上、内容之下」。于是那层深蓝直接盖在白卡上，
   整张卡被压暗成灰（实测卡内 132,143,152 vs 卡外 225,234,240）。
   浅底版要把它换回浅色光晕。 */
.splash-c:before{
  background:radial-gradient(closest-side, rgba(255,255,255,.96), rgba(233,244,252,.72) 58%, rgba(233,244,252,0));
}
.splash-c::after{
  content:"offer鲨 · 职场鱼塘";
  position:absolute; left:0; right:0; top:15px; text-align:center;
  font-size:12px; font-weight:700; letter-spacing:.2em; color:#4E86B4;
}
/* ★ text-shadow 必须显式清掉：深色版给标题和副标题各加了一条深色投影
   （rgba(1,12,22,.75) / rgba(1,12,22,.7)），那是给深水里的白字做衬底用的。
   在浅底上它不会"看不见"，而是把字压出一圈灰边 —— 卡片看着发灰、字看着发糊，
   一半是它，另一半才是上面那条 :before。（复验方法：清掉再看标题边缘。） */
.splash-c h1, .splash-c p, .splash-c .track b,
.splash-c .track span, .splash-c .track em, .splash-tip{text-shadow:none}
.splash-c h1{color:var(--txt); font-size:31px; line-height:1.35; letter-spacing:-.4px; margin:0 0 10px}
.splash-c p{color:var(--dim); font-size:15px; margin:0 0 4px}

/* ---------------- 两个入口：做成「选项」而不是「清单项」 ---------------- */
.tracks{gap:14px; margin:20px 0 4px}
.track{
  position:relative; min-width:236px; padding:17px 46px 18px 21px; border-radius:18px;
  background:linear-gradient(180deg,#FFFFFF 0%,#F2F8FD 100%);
  border:1px solid var(--line2);
  box-shadow:0 8px 20px rgba(24,74,116,.09), inset 0 1px 0 #FFFFFF;
  transition:.18s;
}
/* 左侧强调条 + 右侧箭头：一眼看出这是两个方向，不是两行说明。
   两个伪元素都落在按钮盒子里，指针事件仍归按钮自己，不影响命中测试。 */
.track::before{
  content:""; position:absolute; left:0; top:15px; bottom:15px; width:4px;
  border-radius:0 4px 4px 0; background:linear-gradient(180deg,#3E86C0,#1E5A96);
}
.track::after{
  content:"\2192"; position:absolute; right:18px; top:50%; transform:translateY(-50%);
  font-size:19px; line-height:1; color:#6E9BC4; transition:.18s;
}
.track:hover{
  transform:translateY(-3px); border-color:#9CC2DF;
  background:linear-gradient(180deg,#FFFFFF 0%,#EAF3FB 100%);
  box-shadow:0 14px 30px rgba(24,74,116,.16), inset 0 1px 0 #FFFFFF;
}
.track:hover::after{color:#1E5A96; transform:translateY(-50%) translateX(4px)}
.track b{color:var(--txt); font-size:20px; font-weight:800; letter-spacing:-.2px}
.track span{font-size:13.5px; font-weight:700; color:#2E6C99}
.track em{font-size:12.5px; color:var(--dim); margin-top:4px}
/* 第一个入口是「已经在水里」的那一半，给一档更实的底（不抢主次，只分先后） */
.track:first-child{background:linear-gradient(180deg,#F7FBFF 0%,#E7F1FA 100%); border-color:#B7D4EA}
.splash-tip{margin-top:18px; font-size:13.5px; color:#2A6490}

/* ---------------- 输入条：跟随新位置改成页内白卡 ----------------
   ★ 原来是「底部悬浮条：白玻璃」—— 那条顶边高光（box-shadow:0 -1px 0）和
     backdrop-filter 都是给浮层做的，搬进页内之后再留着会显得像没上完的浮层。
     .chat-bar（吐槽蛐蛐那一条）仍然是页内的，所以它保持原样。 */
.chat-bar{
  background:rgba(255,255,255,.93); border-color:var(--line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:0 -1px 0 var(--emb-hi);
}
.composer{
  background:linear-gradient(180deg,#FFFFFF 0%,#FAFDFF 100%);
  border:1px solid var(--line2);
  box-shadow:0 8px 22px rgba(14,42,68,.07), inset 0 1px 0 var(--emb-hi);
}

/* ---------------- 滚动条：与蓝纹统一 ---------------- */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#F6FAFE}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#CDE1F1,#B6D1E8); border-radius:8px; border:2px solid #F6FAFE}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#B9D5EA,#9CC0DD)}

/* ---------------- 窄屏：纹样降密；侧栏回到顶部条 ---------------- */
@media (max-width:820px){
  body::after{width:520px;height:520px;right:-160px;bottom:-160px}
  body::before{width:420px;height:420px;left:-150px;top:-150px}
  .card{background-image:none}
  .splash::before{width:1180px;height:1180px;bottom:-46%}
  .main{padding:18px 14px 84px}
  .vhead h1{font-size:24px}
}
@media (prefers-reduced-motion: reduce){
  .herofish{display:none}
}

/* =====================================================================
   CTA 还原（2026-09-27 修）
   ---------------------------------------------------------------------
   上面那条 .acts button:not(.pri) 命中了 .acts 里的
   <button class="cta big" id="btnShareMe">导出我的画像卡</button>，
   把它的珊瑚渐变换成了白渐变，而文字色仍是 #FFF6F2，
   像素实测对比度 1.03:1 —— 白字白底，肉眼看不见。
   它恰好是这个产品的传播机制（画像卡导出 / 分享卡获客），不能瞎。

   两处一起改才算修好：
     ① 上面那条加 :not(.cta)，让 CTA 不再被当成「次按钮」；
     ② 这里再兜一层，特异性 (0,2,1) 与那条相同、位置最末 → 后写的赢，
        以后有人往中间插规则也不会再被盖掉。
   ===================================================================== */
button.cta, button.cta[class], button.cta.big{
  background:linear-gradient(135deg,#C9431F 0%,#9E2E10 100%);
  border-color:transparent; color:#FFF6F2; font-weight:700;
}
button.cta:hover:not(:disabled), button.cta[class]:hover:not(:disabled){
  background:linear-gradient(135deg,#FF8E63 0%,#F05732 100%); border-color:transparent;
}
</style>
</head>
